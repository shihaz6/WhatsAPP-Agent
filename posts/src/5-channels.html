<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Catalyst — Channels</title>
<link rel="stylesheet" href="styles.css">
<style>
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .ch { padding: 22px 24px; display: flex; flex-direction: column; gap: 16px; position: relative; overflow: hidden; }
  .ch.live { border-color: rgba(37,211,102,0.35); background: linear-gradient(150deg, rgba(37,211,102,0.13), rgba(37,211,102,0.02) 55%), var(--surface); }
  .ch .top { display: flex; align-items: center; gap: 16px; }
  .logo { width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; flex: none; box-shadow: 0 8px 22px rgba(0,0,0,0.35); }
  .logo svg { width: 30px; height: 30px; }
  .ch .nm { font-weight: 750; font-size: 19px; letter-spacing: -0.01em; display: flex; align-items: center; gap: 10px; }
  .ch .acct { color: var(--muted); font-size: 13.5px; margin-top: 2px; }
  .ch .toggle { margin-left: auto; width: 52px; height: 30px; }
  .ch .toggle::after { width: 24px; height: 24px; }
  .ch .toggle.on::after { left: 24px; }
  .status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 99px; }
  .status.on { background: var(--green-soft); color: var(--green); }
  .status.off { background: var(--surface-3); color: var(--muted); }
  .ch .desc { color: var(--muted); font-size: 14px; }
  .metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .metrics div { background: rgba(0,0,0,0.2); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .metrics b { display: block; font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
  .metrics span { color: var(--muted); font-size: 12px; }
  .connect { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-radius: 12px; border: 1px dashed var(--line-2); }
  .connect span { color: var(--muted); font-size: 13px; }

  .flow { padding: 22px 26px; display: grid; grid-template-columns: 1fr 1.25fr; gap: 30px; align-items: center; }
  .flow h3 { margin: 0; font-size: 17px; }
  .diagram { display: flex; align-items: center; gap: 14px; margin-top: 16px; }
  .sources { display: flex; flex-direction: column; gap: 8px; }
  .src { width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center; }
  .src svg { width: 22px; height: 22px; }
  .src.dim { opacity: 0.35; }
  .arrow { flex: 1; height: 2px; background: linear-gradient(90deg, rgba(255,255,255,0.08), var(--orange)); position: relative; }
  .arrow::after { content: ""; position: absolute; right: -2px; top: -4px; border: 5px solid transparent; border-left-color: var(--orange); }
  .node { padding: 14px 16px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--line-2); text-align: center; font-weight: 700; font-size: 13.5px; }
  .node .bm { width: 36px; height: 36px; margin: 0 auto 7px; border-radius: 10px; background: linear-gradient(140deg, #ff8a3d, var(--orange)); display: grid; place-items: center; box-shadow: 0 6px 18px rgba(255,107,26,0.35); }
  .node .bm svg { fill: #fff; stroke: none; }
  .node .bm.alt svg { fill: none; stroke: #fff; }
  .node small { display: block; color: var(--muted); font-weight: 500; font-size: 11.5px; }
  .settings { display: flex; flex-direction: column; gap: 4px; }
  .set { display: flex; align-items: center; gap: 14px; padding: 11px 0; border-bottom: 1px solid var(--line); }
  .set:last-child { border-bottom: 0; }
  .set .t { font-weight: 600; }
  .set .s { color: var(--muted); font-size: 12.5px; }
  .set .toggle { margin-left: auto; }
</style>
</head>
<body>
<div class="app">
  <div id="nav" data-active="channels"></div>
  <div class="main">
    <div class="page-head">
      <div><h1>Channels</h1><p>Connect every place customers message you. One AI, one inbox, every channel.</p></div>
      <div class="head-actions"><span class="pill"><span class="pulse"></span>2 channels live</span><div class="btn primary" id="add">Add channel</div></div>
    </div>

    <div class="grid" id="channels"></div>

    <div class="card flow">
      <div>
        <h3>How messages flow</h3>
        <div class="muted" style="margin-top:4px">Every channel lands in the same inbox — your AI replies in the customer's language, everywhere.</div>
        <div class="diagram" id="diagram"></div>
      </div>
      <div class="settings" id="settings"></div>
    </div>
  </div>
</div>
<script src="shell.js"></script>
<script>
// Simplified glyphs (not official logos) for each channel.
const GLYPH = {
  whatsapp: '<path fill="#fff" d="M12 3a9 9 0 0 0-7.8 13.5L3 21l4.6-1.2A9 9 0 1 0 12 3zm0 1.6a7.4 7.4 0 1 1-3.9 13.7l-.3-.2-2.6.7.7-2.5-.2-.3A7.4 7.4 0 0 1 12 4.6zm-3 3.6c-.2 0-.5 0-.7.3-.3.3-1 1-1 2.3s1 2.7 1.2 2.9c.1.2 2 3.1 4.9 4.2 2.4.9 2.9.8 3.4.7.5 0 1.7-.7 1.9-1.4.2-.7.2-1.2.2-1.4l-.5-.3-1.8-.9c-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.6.1-.3-.1-1.1-.4-2.1-1.3-.8-.7-1.3-1.5-1.5-1.8-.1-.3 0-.4.1-.5l.4-.5.3-.4v-.5l-.8-2c-.2-.5-.4-.5-.6-.5H9z"/>',
  instagram: '<rect x="4" y="4" width="16" height="16" rx="5" fill="none" stroke="#fff" stroke-width="2"/><circle cx="12" cy="12" r="3.6" fill="none" stroke="#fff" stroke-width="2"/><circle cx="16.8" cy="7.2" r="1.2" fill="#fff"/>',
  messenger: '<path fill="#fff" d="M12 3C7 3 3 6.7 3 11.3c0 2.6 1.3 4.9 3.3 6.4V21l3-1.7c.9.3 1.8.4 2.7.4 5 0 9-3.7 9-8.4S17 3 12 3zm.9 11.2-2.3-2.4-4.4 2.4 4.9-5.2 2.3 2.4 4.4-2.4-4.9 5.2z"/>',
  telegram: '<path fill="#fff" d="m20.7 4.3-17 6.6c-1.2.5-1.1 1.1-.2 1.4l4.3 1.3 1.7 5.1c.2.6.4.8.8.8s.6-.2.9-.5l2.1-2 4.4 3.2c.8.5 1.4.2 1.6-.8l2.9-13.6c.3-1.2-.4-1.7-1.5-1.5zM9.4 13.2l8.1-5.1c.4-.2.7-.1.4.2l-6.7 6.1-.3 3-1.5-4.2z"/>',
};
const BG = {
  whatsapp: "linear-gradient(140deg,#3be37f,#128c7e)",
  instagram: "linear-gradient(140deg,#f9ce34,#ee2a7b 50%,#6228d7)",
  messenger: "linear-gradient(140deg,#00b2ff,#7a3cff)",
  telegram: "linear-gradient(140deg,#4fc3f7,#229ed9)",
};
const glyph = k => `<svg viewBox="0 0 24 24">${GLYPH[k]}</svg>`;

// ---- Edit the fake data here ----
const channels = [
  { key: "whatsapp", name: "WhatsApp Business", acct: "+00 000 000 0921 · Verified", on: true,
    desc: "Your main channel. AI replies 24/7 in 5 languages and verifies payment slips.",
    metrics: [["1,038", "Messages / 30d"], ["3s", "Avg reply"], ["31", "Bookings"]] },
  { key: "instagram", name: "Instagram DMs", acct: "@bloomandco.demo", on: true,
    desc: "Answers DMs and story replies automatically, then books straight into your calendar.",
    metrics: [["209", "Messages / 30d"], ["5s", "Avg reply"], ["7", "Bookings"]] },
  { key: "messenger", name: "Messenger", acct: "Not connected", on: false,
    desc: "Reply to Facebook Page messages from the same inbox, with the same trained AI." },
  { key: "telegram", name: "Telegram", acct: "Not connected", on: false,
    desc: "Add a Telegram bot in two minutes — paste your bot token and you're live." },
];
const settings = [
  ["Reply in the customer's language", "Auto-detects English, Spanish, Arabic, Chinese, Hindi + more", true],
  ["Hand off to a human when unsure", "Tagged “Needs you” and pinned to the top of your inbox", true],
  ["Same knowledge on every channel", "Services, prices, hours and FAQs stay in sync", true],
  ["Quiet hours", "AI still replies; you get notified from 08:00", false],
];
// ---------------------------------

document.getElementById("channels").innerHTML = channels.map(c => `
  <div class="card ch ${c.key === "whatsapp" ? "live" : ""}">
    <div class="top">
      <div class="logo" style="background:${BG[c.key]}">${glyph(c.key)}</div>
      <div><div class="nm">${c.name}<span class="status ${c.on ? "on" : "off"}">${c.on ? "● Active" : "Off"}</span></div><div class="acct">${c.acct}</div></div>
      <div class="toggle ${c.on ? "on" : ""}"></div>
    </div>
    <div class="desc">${c.desc}</div>
    ${c.metrics
      ? `<div class="metrics">${c.metrics.map(([v, l]) => `<div><b>${v}</b><span>${l}</span></div>`).join("")}</div>`
      : `<div class="connect"><span>Takes about 2 minutes · no code</span><div class="btn sm">${ic("plus")}Connect</div></div>`}
  </div>`).join("");

document.getElementById("diagram").innerHTML = `
  <div class="sources">${channels.map(c => `<div class="src ${c.on ? "" : "dim"}" style="background:${BG[c.key]}">${glyph(c.key)}</div>`).join("")}</div>
  <div class="arrow"></div>
  <div class="node"><div class="bm">${ic("bolt")}</div>Catalyst AI<small>replies in ~4s</small></div>
  <div class="arrow"></div>
  <div class="node"><div class="bm alt" style="background:var(--surface-3);box-shadow:none">${ic("inbox")}</div>Unified inbox<small>you step in anytime</small></div>`;

document.getElementById("settings").innerHTML = settings.map(([t, s, on]) =>
  `<div class="set"><div><div class="t">${t}</div><div class="s">${s}</div></div><div class="toggle ${on ? "on" : ""}"></div></div>`).join("");

document.getElementById("add").insertAdjacentHTML("afterbegin", ic("plus"));
</script>
</body>
</html>
